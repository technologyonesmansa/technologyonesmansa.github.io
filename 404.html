<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Halaman Tidak Ditemukan | Technology One</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { navy: "#081235", light: "#f3f4f6", accent: "#3b82f6" },
            fontFamily: { poppins: ["Poppins", "sans-serif"] },
            animation: {
              float: "float 3s ease-in-out infinite",
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-10px)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #f9fafb;
      }

      .text-glow {
        text-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
      }
    </style>
  </head>
  <body
    class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
  >
    <div
      class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-accent opacity-10 rounded-full blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute bottom-[-10%] right-[-10%] w-80 h-80 bg-navy opacity-5 rounded-full blur-3xl pointer-events-none"
    ></div>

    <div
      class="text-center z-10 max-w-lg mx-auto px-6 py-8 md:py-10 bg-white rounded-2xl shadow-lg border border-gray-100"
    >
      <div class="mb-5 inline-block animate-float">
        <div
          class="w-20 h-20 bg-light rounded-full flex items-center justify-center mx-auto shadow-inner"
        >
          <i class="fa-solid fa-robot text-4xl text-accent"></i>
        </div>
      </div>

      <h1
        class="text-6xl md:text-8xl font-bold text-navy mb-2 tracking-tighter text-glow"
      >
        404
      </h1>

      <h2 class="text-xl md:text-2xl font-semibold text-gray-800 mb-3">
        Oops! Halaman Tidak Ditemukan
      </h2>
      <p class="text-sm md:text-base text-gray-500 mb-6 px-2">
        Maaf, halaman yang Anda cari mungkin telah dihapus atau sementara tidak
        tersedia di <span class="font-semibold text-navy">Technology One</span>.
      </p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <a
          href="/"
          class="w-full sm:w-auto bg-accent hover:bg-blue-600 text-white text-sm font-medium py-2.5 px-6 rounded-full transition-all duration-300 shadow hover:shadow-md flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-house"></i>
          Beranda
        </a>
        <a
          href="javascript:history.back()"
          class="w-full sm:w-auto bg-light hover:bg-gray-200 text-navy text-sm font-medium py-2.5 px-6 rounded-full transition-all duration-300 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-arrow-left"></i>
          Kembali
        </a>
      </div>
    </div>
  </body>
</html>
